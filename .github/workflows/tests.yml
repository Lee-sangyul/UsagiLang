name: Python tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check syntax
        run: python -m py_compile usagilang.py usagi_packages.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run Hello World
        run: python usagilang.py examples/hello.usagi
      - name: Validate VS Code extension JSON
        run: |
          python -m json.tool vscode/usagilang/package.json >/dev/null
          python -m json.tool vscode/usagilang/language-configuration.json >/dev/null
          python -m json.tool vscode/usagilang/snippets/usagilang.json >/dev/null
          python -m json.tool vscode/usagilang/syntaxes/usagilang.tmLanguage.json >/dev/null
      - name: Validate VS Code JavaScript syntax
        run: node --check vscode/usagilang/extension.js
      - name: Run v0.2 example
        run: python usagilang.py run examples/v02.usagi
