name: Deploy UsagiLang Playground
on:
  push:
    branches: [main]
    paths:
      - 'docs/playground/**'
      - 'usagilang.py'
      - '.github/workflows/playground-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: usagilang-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp docs/playground/index.html _site/index.html
          cp docs/playground/runner-worker.js _site/runner-worker.js
          cp usagilang.py _site/usagilang.py
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
