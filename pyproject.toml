[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "usagilang"
version = "0.2.0a0"
description = "Unofficial experimental programming language inspired by Usagi expressions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
usagi = "usagilang:main"
usagilang = "usagilang:main"

[tool.setuptools]
py-modules = ["usagilang", "usagi_packages"]
